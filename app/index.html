<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8fafc" />
    <title>financial-agent · operativa</title>
    <!-- The theme is applied here, before the first paint, and not from React:
         for whoever chose dark, waiting for the bundle would flash the light
         theme on every load. The key and both colours are also in
         src/lib/theme.ts, and theme.test.ts checks that they match.
         `color-scheme` stays "light" above on purpose: "light dark" would let
         the browser draw its own controls dark on a dark OS under the light
         theme. The dark theme sets it in index.css instead. -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("colorScheme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#020617");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
